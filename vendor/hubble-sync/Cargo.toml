[package]
name = "hubble-sync"
description = "atproto sync1.1 library (vendored from microcosm.blue/hubble; see NOTICE.md)"
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bytes = "1.11.1"
dasl = "0.2"
futures-util = "0.3.32"
governor = "0.10.4"
http = "1.4.2"
jacquard-api = { version = "0.12.0-beta.2", features = ["streaming"] }
jacquard-common = { version = "0.12.0-beta.2", features = ["streaming"] }
jacquard-identity = "0.12.0-beta.2"
jacquard-repo = "0.12.0-beta.2"
k256 = { version = "0.13.4", features = ["ecdsa"] }
metrics = "0.24"
multibase = "0.9"
n0-future = "0.1" # bleh, just for one (unimplemented) jacquard trait type
p256 = { version = "0.13.2", features = ["ecdsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
repo-stream = "0.5.0-alpha.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
thiserror = "2.0.18"
tokio = { version = "1.51.0", features = ["macros", "io-util", "rt", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.44"

# temporary explicit dependencies to support vendored dasl::cid
data-encoding = "2.11.0"
data-encoding-macro = "0.1.20"
serde_bytes = "0.11.19"
sha2 = "0.11.0"
