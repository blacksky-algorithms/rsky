[package]
name = "rsky-spaces-parity"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
rsky-space-host = { path = "../rsky-space-host" }
rsky-space = { path = "../rsky-space" }
oracle-rsky-space = { package = "rsky-space", git = "https://github.com/blacksky-algorithms/rsky.git", rev = "7ebd21ae788c550ee8510034d94eb19ede148738" }
rsky-pds = { git = "https://github.com/blacksky-algorithms/rsky.git", rev = "7ebd21ae788c550ee8510034d94eb19ede148738" }
rsky-oauth = { path = "../rsky-oauth" }
rsky-crypto = { workspace = true }
anyhow = "1"
serde_json = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
base64 = "0.22"
hmac = "0.12"
sha2 = { workspace = true }
secp256k1 = { workspace = true }
serde = { workspace = true }
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "layer2-gate"
path = "src/bin/layer2_gate.rs"

[[bin]]
name = "resume-gate"
path = "src/bin/resume_gate.rs"
